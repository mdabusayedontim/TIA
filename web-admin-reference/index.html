<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ignite Academy — UI Design Kit</title>
<style>
:root{--navy:#101A35;--navy2:#192844;--gold:#F5A623;--bg:#F4F6FA;--ink:#1F2937;--muted:#718096;--line:#E6EAF1;--green:#16A36A;--red:#DC3545;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"Noto Sans Bengali",system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:white;padding:22px 16px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid #33415e}
.logo{width:42px;height:42px;border-radius:13px;background:var(--gold);display:grid;place-items:center;color:var(--navy);font-size:22px;font-weight:900}
.brand b{display:block;font-size:14px;letter-spacing:.5px}.brand small{color:#b8c4da;font-size:10px}
.rolebox{background:#233454;border:1px solid #354767;border-radius:12px;padding:10px}
.rolebox label{font-size:10px;color:#b8c4da;display:block;margin-bottom:6px}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}
.navtitle{font-size:10px;color:#8fa0bd;text-transform:uppercase;letter-spacing:1.2px;padding:0 10px}
nav{display:grid;gap:5px}.navbtn{border:0;background:transparent;color:#d7dfed;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px}
.navbtn:hover,.navbtn.active{background:#293b5d;color:#fff}.navbtn.active{box-shadow:inset 3px 0 var(--gold)}
.main{min-width:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:2}
.search{border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:min(340px,40vw);color:var(--muted)}
.user{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;background:#fff0d8;color:#9a6100;display:grid;place-items:center;font-weight:800}
.content{padding:28px;max-width:1500px;margin:auto}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
h1{font-size:26px;margin:6px 0 4px;color:var(--navy)}.subtitle{color:var(--muted);font-size:13px;margin:0 0 24px}
.actions{display:flex;gap:10px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:white;font-size:12px}.btn.gold{background:var(--gold);color:#201a10}.btn.light{background:white;border:1px solid var(--line);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 3px 12px #14213b08}
.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .ico{width:38px;height:38px;border-radius:11px;background:#fff2dc;display:grid;place-items:center;font-size:18px}.stat strong{font-size:25px;color:var(--navy);display:block;margin:12px 0 2px}.stat small{color:var(--muted);font-size:11px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.sectionhead h2{font-size:16px;margin:0;color:var(--navy)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border:0}
.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#e8f7ef;color:#147d4b;font-size:10px}.pill.warn{background:#fff2dc;color:#9a6100}.pill.info{background:#eaf1ff;color:#2455a4}.progress{height:8px;background:#edf0f5;border-radius:9px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--gold);border-radius:9px}
.chart{height:180px;display:flex;align-items:end;gap:12px;padding:14px 8px 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:#f7c66f;border-radius:7px 7px 0 0;min-width:12px;position:relative}.bar:after{content:attr(data-label);position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;font-size:12px;min-width:600px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line)}th{background:#f8f9fc;color:#68758b;font-weight:600}tr:last-child td{border:0}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:11px;color:#667085;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.field textarea{min-height:90px}
.mobileframe{max-width:390px;margin:10px auto;background:#f6f7fb;border:8px solid #17223a;border-radius:34px;overflow:hidden;min-height:650px;box-shadow:0 12px 40px #101a3520}.mobhead{background:var(--navy);color:white;padding:22px 18px 28px;border-radius:0 0 22px 22px}.mobhead small{color:#c4cee0}.mobbody{padding:15px}.mobstats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:-12px}.mobcard{background:white;border-radius:13px;padding:13px;box-shadow:0 3px 12px #14213b0c}.mobcard b{font-size:20px;color:var(--navy)}.mobcard small{display:block;color:var(--muted);font-size:10px}.mobnav{display:flex;justify-content:space-around;background:white;padding:13px 4px;position:sticky;bottom:0;border-top:1px solid var(--line);font-size:10px;color:#69758a}.mobnav span{display:grid;justify-items:center;gap:4px}.notice{background:#fff8e9;border:1px solid #f6dfb3;padding:12px;border-radius:10px;font-size:12px;color:#76500d}
.hidden{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.grid{grid-template-columns:repeat(2,1fr)}.content{padding:18px}.cols{grid-template-columns:1fr}.topbar{padding:0 16px}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.topbar .search{display:none}h1{font-size:22px}}
</style></head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">✦</div><div><b>THE IGNITE ACADEMY</b><small>LEARN • GROW • SUCCEED</small></div></div>
 <div class="rolebox"><label>PREVIEW USER ROLE</label><select id="role" onchange="changeRole()"><option value="admin">Admin / Owner</option><option value="student">Student</option><option value="teacher">Teacher</option><option value="parent">Parent</option></select></div>
 <div class="navtitle">Workspace</div><nav id="nav"></nav>
 <div style="margin-top:auto;color:#9aabc7;font-size:10px;padding:8px">UI DESIGN KIT • v1.0<br>Jhenaidah, Bangladesh</div>
</aside>
<main class="main">
 <header class="topbar"><input class="search" placeholder="Search students, batches, invoices..."><div class="user"><span>🔔</span><div class="avatar">IA</div><span id="userlabel">Academy Owner</span></div></header>
 <section class="content" id="screen"></section>
</main></div>
<script>
const menus={
admin:["Dashboard","Admissions","Students","Teachers","Parents","Courses & Subjects","Batches","Class Routine","Attendance","Examinations","Results","Study Materials","Assignments","Live Classes","Fee Management","Expenses","Notices","Reports","Staff Permissions","Settings"],
student:["Dashboard","My Courses","Class Routine","Attendance","Learning Center","Examinations","Results","Assignments","Fees & Payments","Live Classes","Notices","Doubt Solving","Leaderboard","My Profile"],
teacher:["Dashboard","My Batches","Student List","Class Routine","Attendance","Create Exam","Marks Entry","Assignments","Study Materials","Live Classes","Student Performance","My Profile"],
parent:["Dashboard","My Children","Attendance Report","Results","Class Routine","Fee Invoices","Notices","Notifications","My Profile"]
};
let role="admin", current="Dashboard";
const icons=["▦","＋","♙","♧","♧","▤","▣","▦","✓","✎","★","▧","☷","▶","৳","−","▤","▥","⚙","⚙"];
function changeRole(){role=document.getElementById("role").value;current="Dashboard";document.getElementById("userlabel").textContent={admin:"Academy Owner",student:"Student Account",teacher:"Teacher Account",parent:"Parent Account"}[role];render()}
function render(){
 const nav=document.getElementById("nav");nav.innerHTML="";
 menus[role].forEach((m,i)=>{let b=document.createElement("button");b.className="navbtn "+(m===current?"active":"");b.innerHTML=`<span>${icons[i%icons.length]}</span>${m}`;b.onclick=()=>{current=m;render()};nav.appendChild(b)});
 let s=document.getElementById("screen");s.innerHTML=page(current);
}
function stat(icon,n,label,sub){return `<div class="card stat"><div><div class="eyebrow">${label}</div><strong>${n}</strong><small>${sub}</small></div><div class="ico">${icon}</div></div>`}
function page(name){
 const student=role==="student",teacher=role==="teacher",parent=role==="parent";
 if(name==="Dashboard")return `<div class="eyebrow">OVERVIEW / ${role.toUpperCase()}</div><h1>${student?"স্বাগতম, শিক্ষার্থী!":teacher?"শিক্ষক ড্যাশবোর্ড":parent?"অভিভাবক ড্যাশবোর্ড":"Academy Overview"}</h1><p class="subtitle">${student?"আজকের পড়াশোনা ও অগ্রগতি এক নজরে দেখুন।":"The Ignite Academy-এর কার্যক্রম ও গুরুত্বপূর্ণ তথ্য এক জায়গায়।"}</p><div class="grid">${student?stat("📚","06","MY COURSES","চলমান বিষয়"):teacher?stat("👨‍🎓","48","MY STUDENTS","Assigned batches"):parent?stat("🎓","01","LINKED CHILDREN","সক্রিয় শিক্ষার্থী"):stat("👨‍🎓","250","TOTAL STUDENTS","সক্রিয় শিক্ষার্থী")}${stat("✓",student?"92%":teacher?"08":parent?"92%":"12",student||parent?"ATTENDANCE":"TEACHERS",student||parent?"এই মাসের উপস্থিতি":"সক্রিয় শিক্ষক")}${stat("📝",student?"03":"08",student?"UPCOMING TASKS":"ACTIVE BATCHES","চলমান কার্যক্রম")}${stat("৳",student?"1,000":"85K",student?"FEE DUE":"MONTHLY COLLECTION","BDT")}</div><div class="cols"><div><div class="sectionhead"><h2>${student?"আজকের ক্লাস":"সাম্প্রতিক কার্যক্রম"}</h2><button class="btn light">সব দেখুন</button></div><div class="card"><div class="row"><span>ICT — Chapter 04</span><span class="pill info">10:30 AM</span></div><div class="row"><span>English — Grammar</span><span class="pill">12:00 PM</span></div><div class="row"><span>Humanities — History</span><span class="pill warn">Tomorrow</span></div></div><div class="sectionhead"><h2>Monthly Overview</h2></div><div class="card"><div class="chart">${[40,65,48,82,58,92,72].map((v,i)=>`<div class="bar" style="height:${v}%" data-label="${["Sat","Sun","Mon","Tue","Wed","Thu","Fri"][i]}"></div>`).join("")}</div></div></div><div><div class="sectionhead"><h2>Important Notice</h2></div><div class="notice">📢 আগামী সপ্তাহে মাসিক পরীক্ষা অনুষ্ঠিত হবে। পরীক্ষার রুটিন দেখে প্রস্তুতি নাও।</div><div class="sectionhead"><h2>Quick Actions</h2></div><div class="card"><div class="row"><span>＋ নতুন ভর্তি</span><span>→</span></div><div class="row"><span>✓ উপস্থিতি</span><span>→</span></div><div class="row"><span>৳ পেমেন্ট</span><span>→</span></div><div class="row"><span>▤ রিপোর্ট</span><span>→</span></div></div></div></div>`;
 if(name==="My Courses"||name==="Courses & Subjects"||name==="Learning Center")return `<div class="eyebrow">ACADEMIC / ${name.toUpperCase()}</div><h1>${name}</h1><p class="subtitle">বিষয়, অধ্যায় ও শেখার উপকরণ পরিচালনা করুন।</p><div class="grid">${["ICT","English","Humanities / Arts","Bangla"].map((x,i)=>`<div class="card"><div class="ico">${["💻","📘","🌍","📖"][i]}</div><h3>${x}</h3><small class="eyebrow">Class 9–12 • Chapters & Notes</small><p style="font-size:12px;color:var(--muted)">অধ্যায়ভিত্তিক নোট, PDF, ভিডিও ও অনুশীলন।</p><button class="btn light">Open Course →</button></div>`).join("")}</div>`;
 if(name.includes("Attendance"))return `<div class="eyebrow">ACADEMIC / ATTENDANCE</div><h1>${name}</h1><p class="subtitle">উপস্থিতি রেকর্ড, ক্যালেন্ডার ও রিপোর্ট।</p><div class="grid">${stat("✓","92%","PRESENT","এই মাস")}${stat("×","04","ABSENT","এই মাস")}${stat("◷","02","LATE","এই মাস")}${stat("▦","26","TOTAL CLASSES","এই মাস")}</div><div class="sectionhead"><h2>Attendance Records</h2><button class="btn gold">+ Take Attendance</button></div>${table(["Date","Student","Batch","Status"],["08 Nov 2026|Sadia Rahman|Class 10 - A|Present","07 Nov 2026|Rahim Hasan|Class 10 - A|Absent","06 Nov 2026|Nusrat Jahan|Class 11 - B|Present"])}`;
 if(name.includes("Fee")||name==="Payments"||name==="Expenses")return `<div class="eyebrow">FINANCE / ${name.toUpperCase()}</div><h1>${name}</h1><p class="subtitle">ফি, বকেয়া, পেমেন্ট ও আর্থিক হিসাব।</p><div class="grid">${stat("৳","85,000","COLLECTED","এই মাস")}${stat("⌛","22,500","OUTSTANDING","বকেয়া")}${stat("✓","64","PAID INVOICES","এই মাস")}${stat("!","12","PENDING","যাচাই প্রয়োজন")}</div><div class="sectionhead"><h2>Recent Transactions</h2><button class="btn gold">+ Create Invoice</button></div>${table(["Invoice","Student","Amount","Method","Status"],["INV-1024|Sadia Rahman|৳2,000|bKash|Paid","INV-1025|Rahim Hasan|৳1,500|Cash|Pending","INV-1026|Nusrat Jahan|৳2,000|Bank|Paid"])}`;
 if(name.includes("Exam")||name==="Results"||name==="Marks Entry")return `<div class="eyebrow">ASSESSMENT / ${name.toUpperCase()}</div><h1>${name}</h1><p class="subtitle">পরীক্ষা, প্রশ্ন, নম্বর ও ফলাফল পরিচালনা করুন।</p><div class="grid">${stat("📝","08","TOTAL EXAMS","এই সেশন")}${stat("⌛","02","UPCOMING","পরবর্তী পরীক্ষা")}${stat("✓","06","PUBLISHED","ফলাফল")}${stat("🎯","78%","AVERAGE SCORE","সর্বশেষ পরীক্ষা")}</div><div class="sectionhead"><h2>Examination List</h2><button class="btn gold">+ Create Exam</button></div>${table(["Exam","Subject","Date","Total Marks","Status"],["Monthly Test 01|ICT|12 Nov 2026|50|Upcoming","Chapter Test|English|15 Nov 2026|30|Draft","Model Test 01|Humanities|20 Nov 2026|100|Published"])}`;
 if(name==="Admissions"||name==="Students"||name==="Teachers"||name==="Parents"||name==="My Batches"||name==="Student List"||name==="My Children")return `<div class="eyebrow">PEOPLE / ${name.toUpperCase()}</div><h1>${name}</h1><p class="subtitle">প্রোফাইল, ভর্তি ও ব্যবহারকারী ব্যবস্থাপনা।</p><div class="sectionhead"><h2>${name} Directory</h2><button class="btn gold">+ Add New</button></div>${table(["ID","Name","Class / Role","Phone","Status"],["IA-0001|Sadia Rahman|Class 10|017XX-XXXXXX|Active","IA-0002|Rahim Hasan|Class 10|018XX-XXXXXX|Active","IA-0003|Nusrat Jahan|Class 11|019XX-XXXXXX|Pending"])}`;
 if(name==="Class Routine"||name==="Routine"||name==="Live Classes")return `<div class="eyebrow">SCHEDULE / ${name.toUpperCase()}</div><h1>${name}</h1><p class="subtitle">সাপ্তাহিক ক্লাস পরিকল্পনা ও অনলাইন সেশন।</p><div class="card">${["Saturday","Sunday","Monday","Tuesday","Wednesday"].map((d,i)=>`<div class="row"><b>${d}</b><span>${["ICT • 10:30 AM","English • 11:30 AM","Humanities • 10:00 AM","ICT • 12:00 PM","English • 09:30 AM"][i]}</span><span class="pill ${i%2?"info":""}">${i%2?"ONLINE":"OFFLINE"}</span></div>`).join("")}</div>`;
 if(name==="Settings"||name==="My Profile")return `<div class="eyebrow">ACCOUNT / SETTINGS</div><h1>${name}</h1><p class="subtitle">প্রতিষ্ঠান ও ব্যক্তিগত তথ্য পরিচালনা করুন।</p><div class="card"><div class="formgrid">${["Full Name","Phone Number","Email Address","Address","Academy Name","Academic Session"].map(x=>`<div class="field"><label>${x}</label><input placeholder="${x}"></div>`).join("")}</div><p><button class="btn gold">Save Changes</button></p></div>`;
 return `<div class="eyebrow">MANAGEMENT / ${name.toUpperCase()}</div><h1>${name}</h1><p class="subtitle">The Ignite Academy-এর ${name.toLowerCase()} পরিচালনা করুন।</p><div class="sectionhead"><h2>Manage ${name}</h2><button class="btn gold">+ Create New</button></div>${table(["Name","Details","Created","Status"],["ICT Batch A|Class 10 • Morning|08 Nov 2026|Active","English Batch B|Class 11 • Evening|07 Nov 2026|Active","Humanities Batch C|Class 12 • Afternoon|06 Nov 2026|Draft"])}`;
}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.split("|").map((c,i)=>`<td>${i===headers.length-1?`<span class="pill ${c==="Pending"||c==="Draft"?"warn":""}">${c}</span>`:c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
render();
</script></body></html>
